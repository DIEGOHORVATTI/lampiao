<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lampião · elenco de vozes</title>
<style>
body { background: #120c08; color: #e8dcc0; font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 32px; }
h1 { color: #b8862b; letter-spacing: .08em; }
section { border-top: 1px solid #4a3218; margin-top: 32px; padding-top: 12px; }
h2 { color: #d9a441; margin: 0 0 4px; }
.line { color: #a89878; font-style: italic; margin: 2px 0; }
.take { display: grid; grid-template-columns: 28px 230px 1fr; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; }
.take:hover { background: #22170e; }
.take.chosen { background: #3a240f; outline: 1px solid #b8862b; }
.players { display: flex; gap: 8px; flex-wrap: wrap; }
audio { height: 32px; width: 300px; }
textarea { width: 100%; background: #1d140c; color: #e8dcc0; border: 1px solid #4a3218; margin-top: 8px; }
button { position: fixed; right: 32px; bottom: 32px; background: #b8862b; color: #120c08; border: 0; padding: 14px 28px; font-size: 18px; border-radius: 6px; cursor: pointer; }
#status { position: fixed; right: 32px; bottom: 84px; color: #d9a441; }
</style>
</head>
<body>
<h1>LAMPIÃO · ELENCO DE VOZES</h1>
<p>Ouça e marque a melhor voz de cada personagem. Use as notas para pedir ajustes (mais grave, mais alto, mais lento...). Depois clique em salvar.</p>
<div id="cast"></div>
<div id="status"></div>
<button id="save">SALVAR ESCOLHAS</button>
<script>
const load = (path) => fetch(path).then((r) => (r.ok ? r.json() : {}));

function takeRow(character, candidate, takes, chosen) {
  const row = document.createElement("label");
  row.className = "take" + (chosen === candidate ? " chosen" : "");
  const radio = Object.assign(document.createElement("input"), { type: "radio", name: character, value: candidate, checked: chosen === candidate });
  radio.onchange = () => {
    document.querySelectorAll(`input[name="${character}"]`).forEach((r) => r.closest(".take").classList.toggle("chosen", r.checked));
  };
  const name = document.createElement("span");
  name.textContent = candidate.replace("|", " · ");
  const players = document.createElement("div");
  players.className = "players";
  takes.sort((a, b) => a.line - b.line).forEach((t) => players.append(Object.assign(document.createElement("audio"), { controls: true, preload: "none", src: t.file })));
  row.append(radio, name, players);
  return row;
}

async function render() {
  const [cast, takes, choices] = await Promise.all([load("cast.json"), load("takes.json"), load("choices.json")]);
  const root = document.getElementById("cast");
  for (const [character, spec] of Object.entries(cast)) {
    const section = document.createElement("section");
    section.innerHTML = `<h2>${spec.name}</h2>` + spec.lines.map((l, i) => `<p class="line">${i + 1}. ${l[1]}</p>`).join("");
    const groups = {};
    takes.filter((t) => t.character === character).forEach((t) => (groups[`${t.model}|${t.voice}`] ??= []).push(t));
    const picked = choices[character] || {};
    Object.entries(groups).forEach(([candidate, list]) => section.append(takeRow(character, candidate, list, picked.voice)));
    const notes = Object.assign(document.createElement("textarea"), { rows: 2, placeholder: "notas para este personagem", value: picked.notes || "" });
    notes.dataset.character = character;
    section.append(notes);
    root.append(section);
  }
}

document.getElementById("save").onclick = async () => {
  const result = {};
  document.querySelectorAll("textarea[data-character]").forEach((n) => {
    const chosen = document.querySelector(`input[name="${n.dataset.character}"]:checked`);
    result[n.dataset.character] = { voice: chosen ? chosen.value : null, notes: n.value };
  });
  await fetch("/choices", { method: "POST", body: JSON.stringify(result) });
  document.getElementById("status").textContent = "salvo";
};

render();
</script>
</body>
</html>
